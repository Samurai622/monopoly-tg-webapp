<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Monopoly TG</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <div id="players">
      <h2>Гравці</h2>
      <div id="actionPanel">
        <button id="surrenderBtn">Здатися</button>
        <button id="tradeBtn">Обмін</button>
      </div>
    </div>

    <div id="game">
      <div id="controls">
        <button id="rollBtn">🎲 Кинути кубики</button>
        <button id="endTurnBtn" style="display:none;">✅ Завершити хід</button>

        <div id="decisionPanel" style="display:none; margin-top: 10px;">
          <button id="buyBtn" class="action-btn">💳 Купити</button>
          <button id="auctionBtn" class="action-btn">🔨 Аукціон</button>
          <button id="payBtn" class="action-btn" style="background:#ef4444;">💸 Оплатити борг</button>
        </div>

        <div id="diceResult"></div>
      </div>
      <div id="board">
        <div id="center">MONOPOLY</div>
      </div>
    </div>

  </div>

  <!-- ВІКНО ІНФОРМАЦІЇ ПРО КЛІТИНКУ ТА ПРОДАЖ/ЗАСТАВА -->
  <div id="cellModal" class="modal-overlay" style="display:none;">
    <div class="modal-content">
      <button id="closeModalBtn" class="close-btn">✖</button>
      <div id="modalHeader" class="modal-header"></div>
      <h2 id="modalTitle">Назва фірми</h2>
      <div class="modal-body">
        <p>Вартість покупки: <b id="modalPrice">$0</b></p>
        <hr>
        <p>Базова оренда: <b id="modalRent">$0</b></p>
        <p>Оренда (1 рівень): <b id="modalRent1">$0</b></p>
        <p>Оренда (2 рівень): <b id="modalRent2">$0</b></p>
        <p>Оренда (3 рівень): <b id="modalRent3">$0</b></p>
        <p>Оренда (4 рівень): <b id="modalRent4">$0</b></p>
        <p>Оренда (5 МАКС): <b id="modalRentMax">$0</b></p>

        <!-- КНОПКИ УПРАВЛІННЯ ВЛАСНІСТЮ -->
        <div id="modalPropertyControls" style="display:none; margin-top:15px; flex-direction:column; gap:6px;">
          <button id="modalMortgageBtn" class="action-btn" style="background:#f59e0b;">🔒 Заставити</button>
          <button id="modalUnmortgageBtn" class="action-btn" style="background:#22c55e;">🔓 Викупити</button>
          <button id="modalSellBtn" class="action-btn" style="background:#ef4444;">💵 Продати банку</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ВІКНО АУКЦІОНУ -->
  <div id="auctionModal" class="modal-overlay" style="display:none;">
    <div class="modal-content" style="border-color: #f59e0b;">
      <h2 style="color: #f59e0b; margin-top: 15px;">🔨 Аукціон</h2>
      <h3 id="auctionItemName" style="margin-bottom: 5px;">Назва Фірми</h3>
      <div class="modal-body" style="text-align: center;">
        <p style="justify-content: center; font-size: 16px;">
          Поточна ціна: &nbsp;<b id="auctionCurrentPrice" style="color:#4ade80; font-size: 18px;">$0</b>
        </p>
        <p style="justify-content: center; color: #94a3b8; font-size: 12px;">
          Лідер: <b id="auctionLeader" style="margin-left: 5px; color: white;">Немає</b>
        </p>
        <hr style="border-color: #334155; margin: 15px 0;">
        <input type="number" id="auctionBidInput" placeholder="Введіть суму..." class="auction-input">
        <div style="display:flex; gap:10px; margin-top:15px;">
          <button id="auctionMakeBidBtn" class="action-btn" style="background:#22c55e;">Поставити</button>
          <button id="auctionPassBtn" class="action-btn" style="background:#ef4444;">Пас (Вийти)</button>
        </div>
      </div>
    </div>
  </div>

  <div id="taskModal" class="modal-overlay" style="display:none;">
    <div class="modal-content" style="border-color: #a855f7; background: #3b0764; box-shadow: 0 0 20px rgba(168, 85, 247, 0.5);">
      <h2 style="color: #d8b4fe; margin-top: 15px; font-size: 28px;">❓ Шанс</h2>
      <div class="modal-body" style="text-align: center; background: transparent;">
        <p id="taskText" style="font-size: 18px; line-height: 1.5; color: white; margin: 20px 0; font-weight: bold;">
          Текст завдання...
        </p>
        <button id="taskOkBtn" class="action-btn" style="background:#a855f7; width: 100%; font-size: 16px;">
          Зрозуміло
        </button>
      </div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
